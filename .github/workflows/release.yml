name: release

# plugin.json 의 version 이 바뀐 커밋이 main 에 올라오면 그 버전의 태그와 Release 를 만든다.
# 노트는 버전을 올린 커밋의 메시지(제목은 Release 제목, 본문은 노트)로 채운다.
on:
  push:
    branches: [main]
    paths: [plugins/cony/.claude-plugin/plugin.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=plugins/cony/.claude-plugin/plugin.json
          tag="v$(node -p "require('./$file').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 은 이미 있다(버전 말고 다른 줄이 바뀐 커밋)"
            exit 0
          fi
          sha=$(git log -1 --format=%H -G'"version"' -- "$file")
          subject=$(git log -1 --format=%s "$sha" | sed -E 's/^[a-z]+(\([^)]*\))?: //')
          {
            git log -1 --format=%ad --date=short "$sha"
            echo
            git log -1 --format=%b "$sha" | grep -v '^Co-Authored-By:'
          } > notes.md
          gh release create "$tag" --target "$sha" --title "$tag — $subject" --notes-file notes.md --latest
